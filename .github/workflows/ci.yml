name: CI

on:
  push:
    branches: [main, "hardened/*", "pipeline/*"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install pytest pytest-asyncio pytest-cov respx ruff httpx

      - name: Lint
        run: .venv/bin/ruff check orchestrator/ dashboard/ tests/

      - name: Test
        run: .venv/bin/pytest tests/ -v --tb=short

      - name: Coverage
        run: |
          .venv/bin/pytest tests/ \
            --cov=orchestrator --cov=dashboard \
            --cov-report=term-missing \
            --cov-fail-under=70
