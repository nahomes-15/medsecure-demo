[project]
name = "medsecure-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "pytest-cov>=4.0", "respx>=0.21", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short", "--color=yes"]
markers = [
    "unit: Pure function tests, no I/O",
    "integration: Tests with HTTP servers or mocked APIs",
    "slow: Tests that take >1s",
]

[tool.coverage.run]
source = ["orchestrator", "dashboard"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__", "raise NotImplementedError"]
fail_under = 70

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]
